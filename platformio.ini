[platformio]
build_dir = C:/Users/alison.tristao/.platformio/build_t_dongle
; native is a Unity test harness (see [env:native] below), not a buildable
; firmware target -- it has no src/ of its own and pulls in Arduino-only
; libs if a plain `pio run` tries to compile against it. Keep the default
; "build" action scoped to the firmware; run native tests explicitly via
; `pio test -e native` or the Test explorer.
default_envs = tdongle-s3

[env:tdongle-s3]
; esp32 --version
platform            = espressif32
board               = esp32-s3-devkitc-1
board_build.f_cpu   = 240000000L

; serial com
framework           = arduino
; max upload using USB into esp32-s3
upload_speed        = 5000000
monitor_speed       = 921600
upload_port         = COM5
monitor_port        = COM5

; compiler flag
build_unflags = 
    -std=gnu++11
    
build_flags =
    -std=gnu++17
    ; bally_channels.h -- the single channel/ingress table -- lives in the
    ; project's own include/, which the firmware env already puts on the path.
    -I include
    ; ARDUINO_USB_MODE=0 selects the "USB OTG" peripheral (USB.h/USBCDC/
    ; USBHID, TinyUSB-backed) instead of the fixed, non-composite "USB
    ; Serial/JTAG" controller (HWCDC) that ARDUINO_USB_MODE=1 selects --
    ; required to add a HID interface alongside the existing CDC Serial on
    ; the same composite device (see lib/UsbHidMux). Serial keeps using the
    ; Stream/Print API either way (USBCDC now, HWCDC before), so this should
    ; be transparent to the rest of the firmware -- but it is a real change
    ; of underlying class, worth a regression pass on reset-to-bootloader
    ; (DTR).
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DRX_ASYNC_QUEUE_DEPTH=64
    -DBAUDRATE=5000000

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.10
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
    siara-cc/Sqlite3Esp32 @ 2.5
    https://github.com/AlisonTristao/TinyShell.git
    https://github.com/AlisonTristao/BTP.git

board_build.flash_size = 16MB

; Host-native env: runs ProtocolRouter/BtpTransport/DonglePublisher against
; BTP's canonical test vectors without ESP32 hardware (same pattern as
; bally_OS's [env:native]). No Arduino/FreeRTOS code is compiled here.
;
; BTP comes from the sibling checkout rather than the tag [env:tdongle-s3]
; pins, and deliberately: this env exists to test THIS working tree, so it
; should build against the protocol source sitting next to it rather than
; against whatever a remote already published. It also means the host suite
; keeps running while a BTP tag is still in flight, instead of every test
; erroring out on a clone that cannot resolve. The firmware env is the one
; that pins, and it is the pin that ships.
[env:native]
platform = native
test_framework = unity
test_build_src = no
test_filter =
    test_protocol_router
    test_serial_session
    test_subscription_registry
    test_dongle_publisher
    test_hub_relay
    test_dongle_key_store
extra_scripts =
    pre:scripts/native_static.py
    pre:scripts/check_user_text.py
lib_deps =
    symlink://../BTP
build_flags =
    -std=gnu++17
    ; bally_channels.h -- the single channel/ingress table -- lives in the
    ; project's own include/, which the firmware env already puts on the path.
    -I include
