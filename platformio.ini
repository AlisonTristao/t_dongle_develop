[platformio]
build_dir = C:/Users/alison.tristao/.platformio/build_t_dongle

[env:tdongle-s3]
; esp32 --version
platform            = espressif32
board               = esp32-s3-devkitc-1
board_build.f_cpu   = 240000000L

; serial com
framework           = arduino
; max upload using USB into esp32-s3
upload_speed        = 5000000
monitor_speed       = 921600
upload_port         = COM5
monitor_port        = COM5

; compiler flag
build_unflags = 
    -std=gnu++11
    
build_flags =
    -std=gnu++17
    -I include
    ; ARDUINO_USB_MODE=0 selects the "USB OTG" peripheral (USB.h/USBCDC/
    ; USBHID, TinyUSB-backed) instead of the fixed, non-composite "USB
    ; Serial/JTAG" controller (HWCDC) that ARDUINO_USB_MODE=1 selects --
    ; required to add a HID interface alongside the existing CDC Serial on
    ; the same composite device (see lib/UsbHidMux). Serial keeps using the
    ; Stream/Print API either way (USBCDC now, HWCDC before), so this should
    ; be transparent to the rest of the firmware -- but it is a real change
    ; of underlying class, worth a regression pass on reset-to-bootloader
    ; (DTR) and StartupConfig::waitForSerialAndAnimateLed's port-open
    ; detection.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DRX_ASYNC_QUEUE_DEPTH=64
    -DBAUDRATE=5000000

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.10
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
    siara-cc/Sqlite3Esp32 @ 2.5
    https://github.com/AlisonTristao/TinyShell.git
    https://github.com/AlisonTristao/BTP.git#v1.0.1-beta

board_build.flash_size = 16MB

; Host-native env: runs ProtocolRouter/BtpTransport against BTP's
; canonical test vectors without ESP32 hardware (same pattern as
; bally_software's [env:native]). No Arduino/FreeRTOS code is compiled here.
[env:native]
platform = native
test_framework = unity
test_build_src = no
test_filter =
    test_protocol_router
    test_serial_session
    test_subscription_registry
extra_scripts =
    pre:scripts/native_static.py
    pre:scripts/check_user_text.py
lib_deps =
    https://github.com/AlisonTristao/BTP.git#v1.0.1-beta
build_flags =
    -std=gnu++17