[platformio]
build_dir = C:/Users/alison.tristao/.platformio/build_t_dongle
; native is a Unity test harness (see [env:native] below), not a buildable
; firmware target -- it has no src/ of its own and pulls in Arduino-only
; libs if a plain `pio run` tries to compile against it. Keep the default
; "build" action scoped to the firmware; run native tests explicitly via
; `pio test -e native` or the Test explorer.
default_envs = tdongle-s3

[env:tdongle-s3]
; esp32 --version
platform            = espressif32
board               = esp32-s3-devkitc-1
board_build.f_cpu   = 240000000L

; serial com
framework           = arduino
; max upload using USB into esp32-s3
upload_speed        = 5000000
; monitor_speed / BAUDRATE are COSMETIC on this board: it is native USB-CDC
; (ARDUINO_USB_MODE=0), and a CDC ACM link carries no real bit rate -- the
; USB stack ignores whatever is set. Kept aligned only so tools that echo
; "connected at N baud" do not confuse anyone. The one bit rate that IS
; special is 1200 (bootloader touch, see the USB block below) -- never set
; either of these to 1200. (topico 35 F5.6/D.6)
monitor_speed       = 921600
upload_port         = COM5
monitor_port        = COM5
; ARDUINO_USB_MODE=0 (CDC nativa OTG): nao ha transistores DTR/RTS -- a
; sequencia de reset classica do esptool nao faz nada nessa porta. O UNICO
; gatilho de bootloader e o "toque de 1200 bps" (USBCDC::_onLineCoding ->
; usb_persist_restart, ver topico 35 F5.2). O board esp32-s3-devkitc-1 assume
; reset por hardware (MODE=1) e nao liga isso sozinho, entao `pio run -t
; upload` caia direto no "segure o BOTAO BOOT". Ligado aqui:
;   - use_1200bps_touch: faz o esptool abrir a porta a 1200 bps antes de gravar
;   - wait_for_upload_port: a placa re-enumera como bootloader ROM depois do
;     toque; espera a porta nova aparecer em vez de falhar no sync
board_upload.use_1200bps_touch    = yes
board_upload.wait_for_upload_port = yes
; Decodes "Backtrace: 0x... 0x..." panic dumps into file:line using the ELF
; still in .pio/build. Needed to tell an OOM abort() apart from a stack
; overflow / null-deref during the boot-loop investigation (topico 34).
;
; NOT "time": that filter stamps every newline it sees, and TinyShell's line
; editor rewrites the current line (\r + reprint) on every keystroke / tab /
; backspace, so the timestamp gets injected into the middle of what you type.
; The exception decoder only reacts to backtrace lines and leaves the
; interactive prompt alone.
monitor_filters     = esp32_exception_decoder

; compiler flag
build_unflags =
    -std=gnu++11

; The channel/key contract has to hold for the firmware that SHIPS, not just
; for the host test run -- a dongle flashed from a drifted bally_channels.h
; talks to robots that disagree with it, which is exactly the silent failure
; the guard exists to prevent.
extra_scripts =
    pre:scripts/check_channel_contract.py

build_flags =
    -std=gnu++17
    ; bally_channels.h -- the single channel/ingress table -- lives in the
    ; project's own include/, which the firmware env already puts on the path.
    -I include
    ; ARDUINO_USB_MODE=0 selects the "USB OTG" peripheral (USB.h/USBCDC/
    ; USBHID, TinyUSB-backed) instead of the fixed, non-composite "USB
    ; Serial/JTAG" controller (HWCDC) that ARDUINO_USB_MODE=1 selects --
    ; required to add a HID interface alongside the existing CDC Serial on
    ; the same composite device (see lib/UsbHidMux). Serial keeps using the
    ; Stream/Print API either way (USBCDC now, HWCDC before), so this should
    ; be transparent to the rest of the firmware -- but it is a real change
    ; of underlying class, worth a regression pass on reset-to-bootloader
    ; (DTR).
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    ; Uncomment for a FIELD/DEMO build: AppRuntime::begin() then calls
    ; Serial.enableReboot(false), so nothing a host driver does on the line
    ; -- including the 1200-baud touch -- can bounce the running firmware
    ; into the bootloader mid-session. Trade-off: this also disables the
    ; board_upload.use_1200bps_touch path above, so `pio run -t upload` then
    ; needs the BOOT button held. Keep it OFF in the dev env. Topico 35 A.4.
    ; -DDONGLE_USB_NO_AUTORESET
    ; 32, down from 64: g_rxQueue holds RxDatagramEvent (~260 B/slot), so 64
    ; was ~17 KB reserved at boot. 32 still absorbs a full fragment burst
    ; between espnow_rx worker ticks. Part of the boot-heap recovery in
    ; topicos/34 section 1B.
    -DRX_ASYNC_QUEUE_DEPTH=32
    -DBAUDRATE=5000000
    ; Boot-loop instrumentation (topico 34/35): the "! after_* free_heap="
    ; lines, the "! reg:* largest=" lines and the 2s CDC-reenumerate hold.
    ; Keep ON while validating the boot on the bench; COMMENT OUT for a
    ; normal/field build so the boot is quiet and the handshake budget is
    ; not spent on the 2s hold. "last_reset=" stays on either way.
    -DDIAG_BOOT
    ; Topico 33: tried -DBOARD_HAS_PSRAM + memory_type=qio_qspi to offload
    ; the ~200KB of boot-time queues (SQLite/SerialMux/ESP-NOW) onto PSRAM
    ; instead of internal SRAM. On-device log came back "psram size=0
    ; free=0" -- this chip has none (or answers to neither quad nor octal
    ; wiring), so reverted. The actual fix is DatabaseStore::openDatabase()
    ; disabling SQLite's per-connection lookaside cache (32KB back).

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.10
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
    siara-cc/Sqlite3Esp32 @ 2.5
    https://github.com/AlisonTristao/TinyShell.git
    ; Pinned to a tag, never to a branch: this env is the one that ships, and
    ; the wire format it speaks has to be the one bally_OS and TraceView were
    ; built against (TraceView pins the same tag in its CMakeLists.txt). An
    ; unpinned URL resolves once and is then cached in .pio/libdeps forever,
    ; so two firmwares can silently end up on different protocol revisions
    ; with nothing reporting it -- delete .pio/libdeps when changing this.
    https://github.com/AlisonTristao/BTP.git#v2.0.0

board_build.flash_size = 16MB

; Host-native env: runs ProtocolRouter/BtpTransport/DonglePublisher against
; BTP's canonical test vectors without ESP32 hardware (same pattern as
; bally_OS's [env:native]). No Arduino/FreeRTOS code is compiled here.
;
; BTP comes from the sibling checkout rather than the tag [env:tdongle-s3]
; pins, and deliberately: this env exists to test THIS working tree, so it
; should build against the protocol source sitting next to it rather than
; against whatever a remote already published. It also means the host suite
; keeps running while a BTP tag is still in flight, instead of every test
; erroring out on a clone that cannot resolve. The firmware env is the one
; that pins, and it is the pin that ships.
[env:native]
platform = native
test_framework = unity
test_build_src = no
test_filter =
    test_protocol_router
    test_serial_session
    test_clock_text
    test_subscription_registry
    test_dongle_publisher
    test_hub_relay
    test_dongle_key_store
extra_scripts =
    pre:scripts/native_static.py
    pre:scripts/check_user_text.py
    pre:scripts/check_channel_contract.py
lib_deps =
    symlink://../BTP
build_flags =
    -std=gnu++17
    ; bally_channels.h -- the single channel/ingress table -- lives in the
    ; project's own include/, which the firmware env already puts on the path.
    -I include
